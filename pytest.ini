[pytest]
# 测试发现路径
testpaths = tests

# 测试文件命名模式
python_files = test_*.py *_test.py

# 测试类命名模式
python_classes = Test*

# 测试函数命名模式
python_functions = test_*

# 详细输出
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src/zoteroapi
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=85

# 日志配置
log_cli = false
log_cli_level = INFO
log_file_level = DEBUG

# 标记定义
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take a long time to run
    network: Tests that require network access

# 覆盖率配置
[coverage:run]
source = src/zoteroapi
omit = 
    */tests/*
    */test_*.py
    */__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
